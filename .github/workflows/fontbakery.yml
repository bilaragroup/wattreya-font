name: FontBakery

# Check the font against the Google Fonts requirements on every push and pull request.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  fontbakery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FontBakery
        run: |
          python -m pip install --upgrade pip
          pip install "fontbakery[googlefonts]"

      - name: Run FontBakery (Google Fonts profile)
        run: |
          mkdir -p out
          fontbakery check-googlefonts \
            --loglevel WARN \
            --succinct \
            --ghmarkdown out/fontbakery-report.md \
            --html out/fontbakery-report.html \
            fonts/ttf/*.ttf

      - name: Add the report to the job summary
        if: always()
        run: cat out/fontbakery-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontbakery-report
          path: out/
